<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cobrinha do Jardim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: uma tela só. O jogo 9:16 ocupa a altura disponível; a barra de presentes de teste fica embaixo. Visual escuro de propósito (moldura de estúdio). */
:root{
  --bg:#0e1411; --surface:#18211b; --fg:#e7efe8; --muted:#97a89b; --line:#2a372e; --accent:#8b6bff; --accent-fg:#ffffff;
  --font-display:"Fredoka","Baloo 2",ui-rounded,system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{flex:1;min-height:0;display:grid;place-items:center}
.frame{position:relative;border-radius:22px;overflow:hidden;background:#1f4a1e;box-shadow:0 20px 50px -20px rgba(0,0,0,.7),0 0 0 1px var(--line);container-type:inline-size}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.btn{font:500 14px/1 var(--font-body);display:inline-flex;gap:7px;align-items:center;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn small{color:var(--muted);font-size:12px}
.btn kbd{font:600 11px var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sim{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding:0 6px}
.sim input{accent-color:var(--accent);width:16px;height:16px}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:6px 11px;border-radius:999px;border:1px solid var(--line)}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,#7d8a80)}
.conn[data-s="on"]{--dot:#4fd17a;color:var(--fg)}
.conn[data-s="wait"]{--dot:#f2c14e}
.conn[data-s="err"]{--dot:#ff6b6b;color:var(--fg)}
body.live .controls{display:none}
body.live .app{padding:0}
body.live .frame{border-radius:0;box-shadow:none}

/* HUD do jogo. Medidas em cqw (1cqw = 1% da largura da tela do jogo).
   Faixa de cima: 0 a 28,9cqw. Campo da cobra: 28,9 a 148,9cqw. Faixa de baixo: 148,9cqw até o fim. */
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--font-display);color:#2a2152;line-height:1.25}
.chip,.rank,.toast,.legend,.over-card,.intro{background:#fffbe8;color:#2a2152;border:.6cqw solid #2a2152;box-shadow:0 .8cqw 0 #2a2152}
.hud-top{position:absolute;top:3cqw;left:4.2cqw;right:4.2cqw;display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw}
.hud-left{display:flex;flex-direction:column;gap:1.8cqw;min-width:0}
.stats,.sub{display:flex;gap:1.4cqw;flex-wrap:wrap}
.sub{max-width:58cqw}
.chip{padding:1cqw 2.5cqw;border-radius:99px;font-size:3.5cqw;font-weight:600;white-space:nowrap;display:flex;gap:1.1cqw;align-items:center;font-variant-numeric:tabular-nums}
.chip.small{font-size:2.9cqw;padding:.7cqw 2.2cqw}
.chip.fx{background:#2a2152;color:#fffbe8;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.rank{border-radius:3.2cqw;padding:1.5cqw 2.8cqw;font-size:2.9cqw;min-width:31cqw}
.rank h3{margin:0 0 .35em;font-size:2.3cqw;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:.2em}
.rank li{display:flex;justify-content:space-between;gap:2cqw;font-weight:500}
.rank li span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:23cqw}
.rank li span:last-child{font-variant-numeric:tabular-nums;opacity:.8}
.rank .empty{opacity:.6;font-weight:400}
.hud-bottom{position:absolute;left:4.2cqw;right:4.2cqw;top:150cqw;bottom:1.8cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1cqw}
.toasts{display:flex;flex-direction:column;align-items:center;gap:1.1cqw;width:100%}
.toast{padding:1.1cqw 3.2cqw;border-radius:99px;font-size:3.1cqw;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 .6cqw 0 #2a2152;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.toast b{font-weight:700}
.toast em{font-style:normal;font-weight:700;color:#7a52f0}
.toast .gimg{height:1.25em;width:auto;vertical-align:-.3em}
.toast.out{animation:out .45s ease-in forwards}
.legend{padding:.9cqw 3cqw;border-radius:99px;font-size:2.6cqw;font-weight:500;white-space:nowrap;transition:opacity .35s}
.legend.fade{opacity:0}
@keyframes pop{from{transform:translateY(-3cqw) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes out{to{transform:translateY(-2cqw);opacity:0}}

.intro{position:absolute;left:50%;top:60cqw;transform:translateX(-50%);border-radius:5cqw;padding:3.4cqw 6cqw;display:flex;flex-direction:column;align-items:center;gap:.8cqw;text-align:center;font-family:var(--font-display);pointer-events:none;animation:introIn .55s cubic-bezier(.2,1.5,.4,1)}
.intro small{font-size:3cqw;opacity:.7;font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.intro b{font-size:8cqw;line-height:1.05;white-space:nowrap}
.intro span{font-size:3.4cqw;opacity:.8}
.intro.out{animation:introOut .4s ease-in forwards}
@keyframes introIn{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%);opacity:1}}
@keyframes introOut{to{transform:translateX(-50%) translateY(-3cqw);opacity:0}}

.over[hidden],.over-rec[hidden],.over-hero[hidden]{display:none}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,30,15,.35);pointer-events:none}
.over-card{width:74cqw;border-radius:5cqw;padding:5cqw 5cqw 4.4cqw;display:flex;flex-direction:column;align-items:center;gap:2.6cqw;text-align:center;font-family:var(--font-display);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.over-title{font-size:8.6cqw;font-weight:700;line-height:1}
.over-why{font-size:3.6cqw;opacity:.75;margin-top:-1cqw}
.over-rec{font-size:3.4cqw;font-weight:700;color:#fff;background:#7a52f0;border-radius:99px;padding:.8cqw 3cqw}
.over-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;width:100%}
.over-stats div{display:flex;flex-direction:column;align-items:center;background:#f1ecff;border-radius:3cqw;padding:2cqw 1cqw}
.over-stats b{font-size:6.4cqw;line-height:1.1;font-variant-numeric:tabular-nums}
.over-stats span{font-size:2.8cqw;opacity:.7}
.over-hero{font-size:3.5cqw}
.over-hero b{color:#7a52f0}
.over-next{font-size:3.2cqw;opacity:.75}
.over-next b{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){.toast,.toast.out,.over-card,.intro,.intro.out,.chip.fx{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="game" width="360" height="640" aria-label="Jogo da cobrinha"></canvas>
      <div class="hud">
        <div class="hud-top">
          <div class="hud-left">
            <div class="stats">
              <div class="chip" title="Tamanho da cobra">🐍 <span id="h-len">4</span></div>
              <div class="chip" title="Pontos nesta partida">🍎 <span id="h-score">0</span></div>
              <div class="chip" title="Recorde de tamanho">🏆 <span id="h-best">4</span></div>
            </div>
            <div class="sub">
              <div class="chip small" id="h-scene">🌷 Jardim</div>
              <div class="sub" id="h-fx"></div>
            </div>
          </div>
          <div class="rank"><h3>Top presentes</h3><ol id="h-rank"></ol></div>
        </div>
        <div class="hud-bottom">
          <div class="toasts" id="h-toasts"></div>
          <div class="legend" id="h-legend">🌹 1 maçã · 🍩 5 frutas · 🦁 chuva de frutas</div>
        </div>
        <div class="intro" id="intro" hidden><small id="i-round">Partida 1</small><b id="i-name">🌷 Jardim</b><span id="i-hint"></span></div>
      </div>
      <div class="over" id="over" hidden>
        <div class="over-card">
          <div class="over-title">Fim de jogo!</div>
          <div class="over-why" id="o-why">bateu no próprio corpo</div>
          <div class="over-rec" id="o-rec" hidden>Novo recorde!</div>
          <div class="over-stats">
            <div><b id="o-len">0</b><span>tamanho</span></div>
            <div><b id="o-fruits">0</b><span>pontos</span></div>
            <div><b id="o-best">0</b><span>recorde</span></div>
          </div>
          <div class="over-hero" id="o-hero">Maior apoiador: <b id="o-hero-name"></b></div>
          <div class="over-next">Próximo cenário em <b id="o-count">7</b></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls" role="group" aria-label="Presentes de teste">
    <button class="btn" id="g-rose" data-gift="rose">🌹 Rosa <small>1 maçã</small> <kbd>1</kbd></button>
    <button class="btn" id="g-donut" data-gift="donut">🍩 Rosquinha <small>5 frutas</small> <kbd>2</kbd></button>
    <button class="btn" id="g-lion" data-gift="lion">🦁 Leão <small>chuva</small> <kbd>3</kbd></button>
    <button class="btn" id="g-item">✨ Item <kbd>4</kbd></button>
    <button class="btn" id="restart">↻ Próximo cenário</button>
    <label class="sim" for="sim-toggle"><input type="checkbox" id="sim-toggle"> Simular público (exemplo)</label>
    <span class="conn" id="conn" data-s="off">Procurando o programa...</span>
  </div>
</div>

<script>
(() => {
/* ================= Ajustes do jogo ================= */
let STEP = 0.155;            // segundos por casa (menor = mais rápido). O config.json pode mudar isso.
const GREED = 0.07;          // chance de a cobra arriscar um caminho perigoso quando já está grande (0 = nunca)
const GREED_MIN_LEN = 14;    // só arrisca a partir desse tamanho
let SAFE_SCORE = 200;        // a partir desses pontos (🍎) ela nunca arrisca: sobreviver vem antes de comer
let FILL_SCORE = 160;        // a partir desses pontos ela também ocupa o campo de forma compacta (e já não arrisca)
let SPREAD_SCORE = 190;      // a partir desses pontos ela ocupa o máximo do campo, com a cabeça o mais longe possível do rabo
let ORGANIZE_LEN = 190;      // a partir desse TAMANHO ela se organiza antes de comer (frutas e itens ficam em segundo plano)
let HUNGER = 15;             // fome: segundos sem comer fruta até ela ir atrás de uma (segura se der; se não, arriscando). Garante que a partida termina
let ORGANIZE_MAX_FRUITS = 6; // enquanto se organiza, no máximo essas frutas no chão; o resto espera na fila (nada se perde)
let ITEM_EVERY = 15;         // segundos, em média, entre um item especial e outro (0 = sem itens)
let AUTO_APPLE = 5;          // cai uma maçã sozinha a cada X segundos, mesmo sem presentes (0 = desliga)
let FAST_SECONDS = 8;        // 🌶️ pimenta: tempo rápida
let FAST_SPEED = 1.7;        // 🌶️ pimenta: quantas vezes mais rápida que o normal
let SLOW_SECONDS = 8;        // ❄️ floco: tempo lenta
let RAINBOW_SECONDS = 1.6;   // 💎 cristal: tempo arco-íris antes de ficar com a cor nova
let SHROOM_MIN_LEN = 200;    // 🍄 o cogumelo só aparece quando a cobra tem pelo menos esse tamanho
let SHRINK_SECONDS = 10;     // cogumelo: durante esse tempo cada maçã diminui 1 de tamanho (os pontos contam normal)
const MIN_LEN = 4;          // tamanho mínimo da cobra
let ITEM_LIFE = 18;          // segundos que um item fica no chão antes de sumir
const OVER_SECONDS = 7;      // tempo da tela de fim de jogo
const MAX_ON_BOARD = 40;     // frutas no chão ao mesmo tempo; o resto espera na fila
const MAX_QUEUE = 400;       // limite da fila de frutas
const GIFTS = {
  rose:  { emoji: '🌹', label: 'Rosa',      fruits: 1,  coins: 1 },
  donut: { emoji: '🍩', label: 'Rosquinha', fruits: 5,  coins: 30 },
  lion:  { emoji: '🦁', label: 'Leão',      fruits: 22, coins: 29999 }
};
/* ==================================================== */

const W = 360, H = 640, TAU = Math.PI * 2;
const CELL = 24, COLS = 14, ROWS = 18, AX = 12, AY = 104, AW = COLS * CELL, AH = ROWS * CELL;
const N = COLS * ROWS, WALL = 32000;
const START_X = 7, START_Y = 13;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const key = (x, y) => y * COLS + x;
const inside = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const cx = x => AX + x * CELL + CELL / 2, cy = y => AY + y * CELL + CELL / 2;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const WIND = reduceMotion ? 0.35 : 1;
const FRUIT = { apple: ['#ef4b3f', '#a8221f'], green: ['#a6d443', '#5e8f1c'], orange: ['#ffa236', '#c8611a'], gold: ['#ffd84d', '#d29910'] };
const ITEMS = {
  grape:  { emoji: '🍇', color: '#9b5de5', glow: 'rgba(190,140,255,.6)', grow: 3, pts: 3, text: '+3 Cresceu!', w: 25 },
  chili:  { emoji: '🌶️', color: '#e5302b', glow: 'rgba(255,120,80,.6)',  grow: 0, pts: 1, text: 'Rápida!',     w: 20 },
  snow:   { emoji: '❄️', color: '#bfe6ff', glow: 'rgba(150,210,255,.7)', grow: 0, pts: 1, text: 'Lenta...',    w: 20 },
  gem:    { emoji: '💎', color: '#7fe3ff', glow: 'rgba(255,255,255,.7)', grow: 0, pts: 1, text: 'Nova cor!',   w: 15 },
  shroom: { emoji: '🍄', color: '#e5383b', glow: 'rgba(255,150,150,.6)', grow: 0, pts: 1, text: 'Encolhendo!', w: 20 }
};
const growOf = kind => ITEMS[kind] ? ITEMS[kind].grow : 1;
function pickItem() {
  // o cogumelo só entra no sorteio quando a cobra já está grande
  const ks = Object.keys(ITEMS).filter(k => k !== 'shroom' || G.body.length >= SHROOM_MIN_LEN), tot = ks.reduce((s, k) => s + ITEMS[k].w, 0); let r = Math.random() * tot;
  for (const k of ks) { r -= ITEMS[k].w; if (r <= 0) return k; } return ks[0];
}
const PALETTES = [
  { a: '#8b6bff', b: '#a98fff', outline: '#33246f', dot: '#ffd84d', hi: 'rgba(255,255,255,.25)', pupil: '#1d1640' },
  { a: '#22c7a9', b: '#5fe0c7', outline: '#0b4a40', dot: '#fff3a0', hi: 'rgba(255,255,255,.28)', pupil: '#073630' },
  { a: '#ff7a3d', b: '#ffa66b', outline: '#7a2c0b', dot: '#fff6d8', hi: 'rgba(255,255,255,.28)', pupil: '#3b1405' },
  { a: '#ff5fae', b: '#ff93c9', outline: '#7a1a4b', dot: '#fff3a0', hi: 'rgba(255,255,255,.28)', pupil: '#3d0b25' },
  { a: '#3f86ff', b: '#7aaeff', outline: '#163277', dot: '#ffd84d', hi: 'rgba(255,255,255,.28)', pupil: '#0b1a40' },
  { a: '#f5b81c', b: '#ffd66b', outline: '#6e4a00', dot: '#ff5a5a', hi: 'rgba(255,255,255,.3)', pupil: '#3a2600' }
];
let SNAKE = PALETTES[0];
const NAMES = ['ana.lu', 'pedrinho_gamer', 'mari.flor', 'joaovictor', 'bia.santos', 'lucas_rs', 'tia.cida', 'rafa99', 'gabi.oliveira', 'duda.m', 'neto.vlogs', 'carol_mendes'];

/* ---------- Cenários: um diferente a cada partida ---------- */
const SCENES = {
  jardim:    { name: 'Jardim',    icon: '🌷', hint: 'Grama fresquinha, sem obstáculos',  ground: 'grass',  border: 'hedge',    obstacles: 'none', tufts: 'green', ambient: 'garden',
               wall: 'bateu na cerca',          obj: '',                        shadow: 'rgba(20,50,10,.22)',  dust: ['#e9f6c9', '#b7de8a'], vignette: 'rgba(10,30,10,.25)', edge: ['rgba(10,40,5,.55)', '#1e4a1c'] },
  lago:      { name: 'Lago',      icon: '🦆', hint: 'Cuidado pra não cair na água!',     ground: 'grass',  border: 'hedge',    obstacles: 'lake', tufts: 'green', ambient: 'lake',
               wall: 'bateu na cerca',          obj: 'caiu no lago',            shadow: 'rgba(20,50,10,.22)',  dust: ['#e9f6c9', '#b7de8a'], vignette: 'rgba(10,30,30,.25)', edge: ['rgba(10,40,5,.55)', '#1e4a1c'] },
  vulcao:    { name: 'Vulcão',    icon: '🌋', hint: 'Não encoste na lava!',              ground: 'basalt', border: 'lavarock', obstacles: 'lava', tufts: null,    ambient: 'embers',
               wall: 'bateu nas rochas',        obj: 'caiu na lava',            shadow: 'rgba(0,0,0,.38)',     dust: ['#ffb36b', '#6a4a40'], vignette: 'rgba(40,5,0,.4)',    edge: ['rgba(0,0,0,.75)', '#120b0a'] },
  gelo:      { name: 'Gelo',      icon: '❄️', hint: 'Desvie dos blocos de gelo!',        ground: 'ice',    border: 'snow',     obstacles: 'ice',  tufts: null,    ambient: 'snow',
               wall: 'bateu no monte de neve',  obj: 'bateu num bloco de gelo', shadow: 'rgba(40,90,130,.22)', dust: ['#ffffff', '#cfe8f5'], vignette: 'rgba(20,50,80,.22)', edge: ['rgba(60,110,150,.45)', '#9cc3da'] },
  montanhas: { name: 'Montanhas', icon: '⛰️', hint: 'Tem pedra no meio do caminho!',     ground: 'alpine', border: 'cliff',    obstacles: 'rocks', tufts: 'dry',  ambient: 'mist',
               wall: 'bateu no paredão',        obj: 'bateu numa pedra',        shadow: 'rgba(30,40,10,.24)',  dust: ['#e8e2c8', '#b6a77a'], vignette: 'rgba(20,20,30,.26)', edge: ['rgba(20,20,15,.55)', '#3d3a35'] }
};
let SCENE_LIST = Object.keys(SCENES);
let S = SCENES.jardim, sceneId = 'jardim', sceneBag = [], forcedScene = null;
let OBST = new Uint8Array(N), OBST_CELLS = [];

const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * DPR; canvas.height = H * DPR;

function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, TAU); c.fill(); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const inArena = (px, py, m = 0) => px > AX - m && px < AX + AW + m && py > AY - m && py < AY + AH + m;

/* ---------- Obstáculos: sorteados a cada partida, sem nunca fechar um pedaço do campo ---------- */
function genObstacles(type) {
  if (type === 'none') return [];
  const startSafe = (x, y) => x >= START_X - 2 && x <= START_X + 2 && y >= START_Y - 4;
  for (let attempt = 0; attempt < 80; attempt++) {
    const set = new Set();
    const add = (x, y) => { if (inside(x, y) && !startSafe(x, y)) set.add(key(x, y)); };

function eatAt(c) {
  const f = G.fruits.find(f => !f.dead && f.cx === c.x && f.cy === c.y && f.z < 20);
  if (!f) return;
  f.dead = true;
  if (f.item) { applyItem(f.kind, c); return; }
  G.eaten += f.kind === 'gold' ? 3 : 1;          // a pontuação é sempre a mesma
  G.noEat = 0;
  if (!G.fx.shrink) G.grow += 1;
  else if (G.grow > 0) G.grow -= 1;               // cogumelo ativo: cada maçã diminui 1 de tamanho
  else if (G.body.length > MIN_LEN) {
    const t = G.body.pop(); G.prevTail = G.body[G.body.length - 1];
    burst(cx(t.x), cy(t.y), [SNAKE.a, SNAKE.b, '#ffffff'], 6, 90);
  }
  burst(cx(c.x), cy(c.y), [FRUIT[f.kind][0], '#ffffff', '#ffe27a'], 12);
  floatText(cx(c.x), cy(c.y) - 16, f.kind === 'gold' ? '+3' : '+1');
}

  G.steps = (G.steps || 0) + 1;

  if (!inside(mv.x, mv.y)) return die(S.wall, mv);
  if (OBST[key(mv.x, mv.y)]) return die(S.obj, mv);
  for (let i = 0; i < n; i++) {
    const s = G.body[i];
    if (s.x === mv.x && s.y === mv.y && !(i === n - 1 && G.grow === 0)) return die('bateu no próprio corpo', mv);
  }
  G.body.unshift({ x: mv.x, y: mv.y });
  if (G.grow > 0) { G.grow--; G.prevTail = G.body[G.body.length - 1]; } else G.prevTail = G.body.pop();
  if (G.body.length > G.best) { G.best = G.body.length; try { localStorage.setItem('cobrinha.recorde', String(G.best)); } catch (e) {} }
  updateHud();
}
function die(cause, to) {
  G.phase = 'dying'; G.dieT = 0; G.cause = cause; G.bumpTo = to; G.stepT = 0; G.popped = 0;
  G.recordHit = G.body.length >= G.best && G.body.length > 4;
}

function bodyPoints(p) {
  const b = G.body, n = b.length, pts = [];
  pts.push({ x: lerp(cx(b[1].x), cx(b[0].x), p), y: lerp(cy(b[1].y), cy(b[0].y), p) });
  for (let i = 1; i < n; i++) pts.push({ x: cx(b[i].x), y: cy(b[i].y) });
  pts.push({ x: lerp(cx(G.prevTail.x), cx(b[n - 1].x), p), y: lerp(cy(G.prevTail.y), cy(b[n - 1].y), p) });
  let poly = pts;
  for (let it = 0; it < 2; it++) {
    const o = [poly[0]];
    for (let i = 0; i < poly.length - 1; i++) {
      const a = poly[i], c = poly[i + 1];
      o.push({ x: a.x * 0.75 + c.x * 0.25, y: a.y * 0.75 + c.y * 0.25 }, { x: a.x * 0.25 + c.x * 0.75, y: a.y * 0.25 + c.y * 0.75 });
    }
    o.push(poly[poly.length - 1]); poly = o;
  }
  const out = [poly[0]], sp = 4; let acc = 0, need = sp;
  for (let i = 1; i < poly.length; i++) {
    const a = poly[i - 1], c = poly[i], d = Math.hypot(c.x - a.x, c.y - a.y); if (!d) continue;
    let start = acc; acc += d;
    while (acc >= need) { const tt = (need - start) / d; out.push({ x: a.x + (c.x - a.x) * tt, y: a.y + (c.y - a.y) * tt }); need += sp; }
  }
  return out;
}

  if (!dead && (G.t % 2.6) < 0.28) {
    c.strokeStyle = '#ff4d6d'; c.lineWidth = 1.8; c.lineCap = 'round';
    c.beginPath(); c.moveTo(R + 4, 0); c.lineTo(R + 11, 0); c.lineTo(R + 14, -2.5); c.moveTo(R + 11, 0); c.lineTo(R + 14, 2.5); c.stroke();
  }
  c.restore();
}

function drawTuft(c, tf, body) {
  let pushX = 0, flat = 1;
  for (const p of body) { const dx = tf.x - p.x, dy = tf.y - p.y, dd = Math.hypot(dx, dy); if (dd < 24) { pushX += (dx >= 0 ? 1 : -1) * (24 - dd) * 0.5; flat = Math.min(flat, 0.55 + dd / 54); } }
  pushX = clamp(pushX, -12, 12);
  c.fillStyle = 'rgba(25,60,15,.22)'; c.beginPath(); c.ellipse(tf.x + 2, tf.y + 1, 9, 3.4, 0, 0, TAU); c.fill();
  for (const b of tf.blades) {
    const h = b.h * flat, sw = Math.sin(G.t * 1.8 + tf.x * 0.04 + b.ph) * 2.6 * WIND + pushX + b.ox * 0.6, bx = tf.x + b.ox;
    c.fillStyle = b.c; c.beginPath(); c.moveTo(bx - 1.6, tf.y);
    c.quadraticCurveTo(bx + sw * 0.3, tf.y - h * 0.6, bx + sw, tf.y - h); c.quadraticCurveTo(bx + sw * 0.3 + 0.5, tf.y - h * 0.6, bx + 1.6, tf.y); c.fill();
  }
}

function draw() {
  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  let shake = 0;
  if (G.phase === 'dying' && G.dieT < 0.35) shake = (1 - G.dieT / 0.35) * 5;
  c.save(); if (shake) c.translate(rnd(-shake, shake), rnd(-shake, shake));
  c.drawImage(STATIC, 0, 0, W, H);
  drawObstacleFx(c);

  const p = G.phase === 'play' ? clamp(G.stepT / curStep(), 0, 1) : 1;
  let pts = bodyPoints(p);
  if (G.phase === 'dying' && G.bumpTo) {
    const k = Math.sin(clamp(G.dieT / 0.25, 0, 1) * Math.PI) * 0.3, h = G.body[0];
    pts[0] = { x: lerp(cx(h.x), cx(G.bumpTo.x), k), y: lerp(cy(h.y), cy(G.bumpTo.y), k) };
  }
  const total = pts.length;
  let visible = total;
  if (G.phase === 'dying' || G.phase === 'over') {
    const k = clamp((G.dieT - 0.7) / 1.1, 0, 1); visible = Math.max(0, Math.round(total * (1 - k)));
    while (G.popped < total - visible) {
      const q = pts[total - 1 - G.popped];
      if (G.popped % 5 === 0 && q) burst(q.x, q.y, [SNAKE.a, SNAKE.b, '#ffd84d'], 4, 90);
      G.popped++;
    }
  }
  pts = pts.slice(0, visible);
  const n = pts.length, R = 10;
  const rad = i => { const k = i / Math.max(1, total - 1); return R * (k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4 * 0.68); };
  const near = [];
  for (let i = 0; i < n; i += 3) near.push(pts[i]);

  // Moitas de grama sempre na camada de baixo: a cobra passa por cima e elas só se abrem.
  for (const tf of tufts) drawTuft(c, tf, near);
  for (const f of G.fruits) {
    const k = clamp(1 - f.z / 520, 0.2, 1);
    c.fillStyle = S.shadow; c.globalAlpha = k * 1.2; c.beginPath(); c.ellipse(cx(f.cx) + 1, cy(f.cy) + 3, f.r * k + 1, f.r * 0.45 * k + 0.5, 0, 0, TAU); c.fill(); c.globalAlpha = 1;
  }
  if (n > 0) {
    const flash = G.phase === 'dying' && G.dieT < 0.7 && Math.floor(G.dieT * 12) % 2 === 0;
    const rainbow = G.fx.rainbow > 0 && G.phase === 'play';
    c.fillStyle = S.shadow; for (let i = n - 1; i >= 0; i--) circle(c, pts[i].x + 3, pts[i].y + 5, rad(i) + 1);
    c.fillStyle = SNAKE.outline; for (let i = n - 1; i >= 1; i--) circle(c, pts[i].x, pts[i].y, rad(i) + 2.2);
    for (let i = n - 1; i >= 1; i--) {
      c.fillStyle = flash ? '#ffffff' : rainbow ? `hsl(${(i * 9 + G.t * 400) % 360},85%,62%)` : ((Math.floor(i / 4) % 2) ? SNAKE.a : SNAKE.b);
      circle(c, pts[i].x, pts[i].y, rad(i));
    }
    c.fillStyle = SNAKE.dot; for (let i = n - 1; i >= 3; i -= 4) circle(c, pts[i].x, pts[i].y, rad(i) * 0.34);
    c.fillStyle = SNAKE.hi; for (let i = n - 1; i >= 1; i--) circle(c, pts[i].x - rad(i) * 0.3, pts[i].y - rad(i) * 0.35, rad(i) * 0.3);
    if (G.fx.speed && G.phase === 'play') {   // rastro de velocidade / gelinho
      const fast = G.fx.speed.kind === 'fast';
      for (let i = 2; i < Math.min(n, 30); i += 5) { c.globalAlpha = 0.5 * (1 - i / 30); c.fillStyle = fast ? '#ffb347' : '#cfeeff'; circle(c, pts[i].x + rnd(-3, 3), pts[i].y + rnd(-3, 3), fast ? 2.2 : 1.8); }
      c.globalAlpha = 1;
    }
    if (n === total) {
      const h = pts[0], q = pts[Math.min(3, n - 1)];
      let ang = Math.atan2(h.y - q.y, h.x - q.x);
      if (Math.hypot(h.x - q.x, h.y - q.y) < 0.5) { const b0 = G.body[0], b1 = G.body[1]; ang = Math.atan2(b0.y - b1.y, b0.x - b1.x); }
      drawHead(c, h.x, h.y, ang, R, G.phase !== 'play');
    }
  }
  for (const f of G.fruits) {
    const fx = cx(f.cx), fy = cy(f.cy) - f.z - f.r * 0.5;
    if (f.item) drawItem(c, fx, fy, f); else drawFruit(c, fx, fy, f.r, f.kind, f.sq);
  }

  for (const q of parts) {
    const k = 1 - q.age / q.life; c.globalAlpha = k;
    if (q.txt) {
      c.font = '700 17px Fredoka, system-ui, sans-serif'; c.textAlign = 'center'; c.lineJoin = 'round';
      c.lineWidth = 4; c.strokeStyle = SNAKE.outline; c.strokeText(q.txt, q.x, q.y); c.fillStyle = q.c; c.fillText(q.txt, q.x, q.y);
    } else { c.fillStyle = q.c; circle(c, q.x, q.y, q.r * (0.4 + k * 0.6)); }
  }
  c.globalAlpha = 1;
  drawAmbient(c);
  c.restore();
  const v = c.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.5, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, S.vignette);
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.07; c.drawImage(GRAIN, 0, 0, W, H);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}

/* ---------- Atualização ---------- */
function update(dt) {
  G.t += dt;
  dripFruits(dt);
  if (G.phase === 'play') {
    tickEffects(dt); spawnItems(dt); autoApple(dt); G.noEat += dt;
    G.stepT += dt;
    let st = curStep();
    while (G.stepT >= st && G.phase === 'play') { G.stepT -= st; step(); st = curStep(); }
  } else if (G.phase === 'dying') {
    G.dieT += dt; if (G.dieT > 2.1) showOver();
  } else if (G.phase === 'over') {
    G.dieT += dt; G.overT -= dt;
    $('o-count').textContent = Math.max(1, Math.ceil(G.overT));
    if (G.overT <= 0) reset();
  }
  const occ = new Map(G.body.map((b, i) => [key(b.x, b.y), i]));
  for (const f of G.fruits) {
    if (f.z > 0 || f.vz) {
      f.vz += 900 * dt; f.z -= f.vz * dt;
      if (f.z <= 0) {
        f.z = 0;
        if (f.vz > 230) { f.vz = -f.vz * 0.32; f.sq = 0.6; burst(cx(f.cx), cy(f.cy), S.dust, 5, 60); }
        else {
          f.vz = 0;
          const i = occ.get(key(f.cx, f.cy));
          if (i !== undefined && i > 0) { const free = freeCells(); if (free.length) { const c = pick(free); f.cx = c.x; f.cy = c.y; f.z = 70; } }
        }
      }
    } else if (f.item && G.phase === 'play' && (f.life -= dt) <= 0) {
      f.dead = true; burst(cx(f.cx), cy(f.cy), [ITEMS[f.kind].color, '#ffffff'], 8, 70);
    }
    f.sq += (1 - f.sq) * Math.min(1, dt * 10);
  }
  G.fruits = G.fruits.filter(f => !f.dead);
  for (const q of parts) { q.age += dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].age >= parts[i].life) parts.splice(i, 1);
  updateAmbient(dt);
  renderFx();
}

/* ---------- Tamanho da tela ---------- */
const frame = $('frame'), stage = $('stage');
if (location.hash === '#live') document.body.classList.add('live');
function fit() {
  const r = stage.getBoundingClientRect();
  let h = r.height, w = h * 9 / 16;
  if (w > r.width) { w = r.width; h = w * 16 / 9; }
  frame.style.width = Math.floor(w) + 'px'; frame.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', fit); fit();

/* ---------- Controles de teste ---------- */
document.querySelectorAll('[data-gift]').forEach(b => b.addEventListener('click', () => gift(b.dataset.gift, 'você (teste)')));
$('g-item').addEventListener('click', () => window.cobrinha.item());
$('restart').addEventListener('click', reset);
window.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  if (e.key === '4') { window.cobrinha.item(); return; }
  const k = { '1': 'rose', '2': 'donut', '3': 'lion' }[e.key]; if (k) gift(k, 'você (teste)');
});
const simEl = $('sim-toggle');
// Fora do programa (prévia), o público simulado já começa ligado; na live, sempre desligado.
simEl.checked = !isLocal && !document.body.classList.contains('live');
let lastLion = performance.now();
(function simLoop() {
  setTimeout(() => {
    if (simEl.checked && !document.hidden) {
      const r = Math.random(), now = performance.now();
      if (r < 0.04 && now - lastLion > 50000) { lastLion = now; gift('lion', pick(NAMES)); }
      else gift(r < 0.76 ? 'rose' : 'donut', pick(NAMES));
    }
    simLoop();
  }, rnd(2400, 4400));
})();

reset(); renderRank(); connectWs();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
